<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frontdesk</title>
<style>
:root{
  --bg:#e9eef2; --surface:#fff; --ink:#14202b; --muted:#5a6b7a; --line:#d3dce4;
  --accent:#0b6e8a; --accent-ink:#fff; --late:#b3261e; --late-bg:#fde7e5;
  --wait:#7a4f00; --wait-bg:#fff0cf; --note-bg:#fff6d1; --note-line:#c9a227; --ok:#1d6b3f;
  font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f161c; --surface:#18222b; --ink:#e6edf3; --muted:#93a4b3; --line:#2b3947;
    --accent:#4fb4d0; --accent-ink:#06222b; --late:#ff8f86; --late-bg:#3a1c1a;
    --wait:#f2c46d; --wait-bg:#37290d; --note-bg:#32290d; --note-line:#a98a1c; --ok:#6fd39b; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
header h1{font-size:19px;margin:0 8px 0 0;letter-spacing:.2px}
header .spacer{flex:1}
select,input,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn:disabled{opacity:.5;cursor:not-allowed}
main{display:grid;grid-template-columns:minmax(340px,5fr) 7fr;gap:16px;padding:16px 20px;align-items:start}
@media (max-width:900px){ main{grid-template-columns:1fr} }
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:10px 6px;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted)}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.row{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 14px}
.row:hover,.row[aria-current=true]{background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.row .top{display:flex;gap:8px;align-items:baseline}
.row .subj{font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{color:var(--muted);font-size:13px;margin-top:2px}
.chip{display:inline-block;border-radius:99px;padding:1px 9px;font-size:12px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.critical{border-color:var(--late);color:var(--late)}
.chip.late{background:var(--late-bg);border-color:var(--late);color:var(--late);font-weight:600}
.chip.wait{background:var(--wait-bg);border-color:var(--wait);color:var(--wait)}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.late i{background:var(--late)}
.bar.wait i{background:repeating-linear-gradient(45deg,var(--wait) 0 6px,transparent 6px 12px)}
.empty{padding:28px 18px;color:var(--muted)}
.detail{padding:16px 18px}
.detail h2{margin:0 0 6px;font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.sla{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin:12px 0;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.sla b{font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.thread{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.msg{border:1px solid var(--line);border-radius:8px;padding:9px 12px;max-width:92%}
.msg.customer{align-self:flex-start}
.msg.agent{align-self:flex-end;background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.msg.internal{align-self:stretch;max-width:100%;background:var(--note-bg);border-color:var(--note-line);border-left-width:5px}
.msg .who{font-size:12.5px;color:var(--muted);margin-bottom:3px}
.msg.internal .who{color:var(--ink);font-weight:600}
.msg p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.composer{border:1px solid var(--line);border-radius:8px;padding:10px}
.composer.note{background:var(--note-bg);border-color:var(--note-line)}
.seg{display:flex;gap:6px;margin-bottom:8px}
.seg button{border:1px solid var(--line);background:none;border-radius:6px;padding:5px 10px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.composer textarea{width:100%;min-height:84px;resize:vertical}
.composer .foot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-top:8px}
details{margin-top:16px;font-size:14px}
summary{cursor:pointer;color:var(--muted)}
.ev{display:grid;grid-template-columns:150px 1fr;gap:2px 12px;margin:8px 0 0;padding:0;list-style:none}
.demo{margin-top:16px;padding:10px 12px;border:1px dashed var(--line);border-radius:8px;font-size:14px;color:var(--muted)}
.demo textarea{width:100%;margin:6px 0;min-height:52px}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);width:min(440px,92vw)}
dialog label{display:block;margin:10px 0 3px;font-size:14px}
dialog input,dialog select,dialog textarea{width:100%}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;display:none;max-width:90vw}
</style>
</head>
<body>
<header>
  <h1>Frontdesk</h1>
  <label for="agent" style="color:var(--muted)">Working as</label>
  <select id="agent"></select>
  <span class="spacer"></span>
  <button class="btn" id="newBtn">Add test ticket</button>
</header>

<main>
  <section class="panel" aria-label="Tickets">
    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" data-scope="mine">My tickets</button>
      <button role="tab" data-scope="unassigned">Unassigned</button>
      <button role="tab" data-scope="all">All open</button>
      <button role="tab" data-scope="done">Done</button>
    </div>
    <div id="list"></div>
  </section>
  <section class="panel" id="detail" aria-live="polite"><div class="empty">Choose a ticket to read the thread and reply.</div></section>
</main>

<dialog id="newDlg">
  <form method="dialog" id="newForm">
    <h3 style="margin:0">New ticket, written as the customer</h3>
    <label for="nName">Name</label><input id="nName" required value="Cara Customer">
    <label for="nEmail">Email</label><input id="nEmail" type="email" required value="cara@example.com">
    <label for="nSubject">Subject</label><input id="nSubject" required>
    <label for="nSev">How bad is it?</label>
    <select id="nSev">
      <option value="critical">Cannot work at all</option>
      <option value="medium" selected>Something is wrong</option>
      <option value="low">Question or small request</option>
    </select>
    <label for="nBody">Message</label><textarea id="nBody" required></textarea>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
      <button class="btn" value="cancel" formnovalidate>Cancel</button>
      <button class="btn primary" value="ok">Create ticket</button>
    </div>
  </form>
</dialog>
<div id="toast" role="status"></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state = { agent: localStorage.getItem('agent') || '', scope: 'mine', selected: null, mode: 'public', draft: '' };
const PRIO = { critical: 'Cannot work', medium: 'Medium', low: 'Small' };
const STATUS = { open: 'Open', in_progress: 'In progress', waiting_customer: 'Waiting on customer', resolved: 'Resolved', closed: 'Closed' };

const fmt = (iso) => iso ? new Date(iso).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : '';
const mins = (m) => m >= 60 ? `${Math.floor(m / 60)}h ${Math.round(m % 60)}m` : `${Math.round(m)}m`;

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 4000); }

async function call(prefix, method, url, body) {
  const r = await fetch(prefix + url, { method, headers: { 'content-type': 'application/json', 'x-agent-id': state.agent }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
const api = (m, u, b) => call('/api', m, u, b);

// The clock that matters most right now: first reply until it is sent, then the fix.
function mainClock(t) {
  const s = t.sla;
  if (!s.reply.done && t.status !== 'resolved' && t.status !== 'closed') return { label: 'Reply due', c: s.reply };
  return { label: 'Fix due', c: s.resolution };
}
function badges(t) {
  const out = [`<span class="chip ${t.priority}">${PRIO[t.priority]}</span>`];
  if (t.sla.is_late) out.push('<span class="chip late">Late</span>');
  if (t.sla.is_waiting) out.push('<span class="chip wait">Waiting on customer</span>');
  else if (!['resolved', 'closed'].includes(t.status)) out.push(`<span class="chip">${STATUS[t.status]}</span>`);
  else out.push(`<span class="chip">${STATUS[t.status]}</span>`);
  return out.join(' ');
}

async function loadAgents() {
  const agents = await fetch('/api/agents').then((r) => r.json());
  $('#agent').innerHTML = agents.map((a) => `<option value="${a.id}">${esc(a.name)}</option>`).join('');
  if (!agents.some((a) => String(a.id) === state.agent)) state.agent = String(agents[0].id);
  $('#agent').value = state.agent;
}

async function loadList() {
  document.querySelectorAll('#tabs button').forEach((b) => b.setAttribute('aria-selected', b.dataset.scope === state.scope));
  let rows;
  try { rows = await api('GET', `/tickets?scope=${state.scope}`); } catch (e) { toast(e.message); return; }
  if (!rows.length) {
    $('#list').innerHTML = `<div class="empty">${state.scope === 'mine' ? 'Nothing assigned to you. Take a ticket from Unassigned.' : 'No tickets here.'}</div>`;
    return;
  }
  $('#list').innerHTML = rows.map((t) => {
    const k = mainClock(t); const done = ['resolved', 'closed'].includes(t.status);
    const pct = Math.min(100, Math.round((k.c.used / k.c.budget) * 100));
    const cls = t.sla.is_late ? 'late' : t.sla.is_waiting ? 'wait' : '';
    return `<button class="row" data-id="${t.id}" aria-current="${state.selected === t.id}">
      <div class="top"><span class="subj">#${t.id} ${esc(t.subject)}</span>${badges(t)}</div>
      <div class="meta">${esc(t.customer_name)}${t.assignee_name ? ' - ' + esc(t.assignee_name) : ' - unassigned'}${done ? '' : ` - ${k.label} ${fmt(k.c.due_at)}`}</div>
      ${done ? '' : `<div class="bar ${cls}" aria-hidden="true"><i style="width:${pct}%"></i></div>`}
    </button>`;
  }).join('');
}

async function openTicket(id, keepDraft) {
  state.selected = id;
  if (!keepDraft) state.draft = '';
  let d;
  try { d = await api('GET', `/tickets/${id}`); } catch (e) { toast(e.message); return; }
  const t = d.ticket, s = t.sla, mine = String(t.assignee_id) === state.agent;
  const done = ['resolved', 'closed'].includes(t.status);
  const rep = s.reply.done
    ? `Answered after ${mins(s.reply.used)} of ${mins(s.reply.budget)} allowed${s.reply.breached ? ' (missed)' : ''}`
    : `${mins(s.reply.used)} of ${mins(s.reply.budget)} used, due ${fmt(s.reply.due_at)}`;
  const fix = done ? `Finished after ${mins(s.resolution.used)} of ${mins(s.resolution.budget)} allowed${s.resolution.breached ? ' (missed)' : ''}`
    : `${mins(s.resolution.used)} of ${mins(s.resolution.budget)} used, due ${fmt(s.resolution.due_at)}`;
  const canReply = mine && !done;
  const composerHint = !mine && !done ? 'Take this ticket to reply to the customer. You can still leave a team note.' : '';
  if (!canReply) state.mode = 'internal'; else if (!state.mode) state.mode = 'public';

  $('#detail').innerHTML = `<div class="detail">
    <h2>#${t.id} ${esc(t.subject)}</h2>
    <div>${esc(t.customer_name)} (${esc(t.customer_email)}) - ${t.assignee_name ? 'assigned to ' + esc(t.assignee_name) : 'unassigned'}${t.parent_ticket_id ? ` - follows #${t.parent_ticket_id}` : ''}</div>
    <div class="chips">${badges(t)}</div>
    <div class="sla">
      <b>First reply</b><span>${rep}</span>
      <b>Fix</b><span>${fix}</span>
      ${t.sla.is_waiting ? '<b>Clock</b><span>Paused until the customer replies</span>' : ''}
      ${s.reopen_until ? `<b>Reopen</b><span>Customer can reopen until ${fmt(s.reopen_until)}</span>` : ''}
    </div>
    <div class="actions">
      ${!t.assignee_id && t.status === 'open' ? '<button class="btn primary" id="take">Take this ticket</button>' : ''}
      ${mine && !done ? `<button class="btn" id="wait" ${t.status === 'waiting_customer' ? 'disabled' : ''}>Waiting on customer</button><button class="btn" id="resolve">Mark as done</button>` : ''}
      ${!done ? `<label>Priority <select id="prio">${Object.keys(PRIO).map((p) => `<option value="${p}" ${p === t.priority ? 'selected' : ''}>${PRIO[p]}</option>`).join('')}</select></label>` : ''}
    </div>
    <div class="thread">${d.messages.map((m) => `
      <div class="msg ${m.visibility === 'internal' ? 'internal' : m.author_type}">
        <div class="who">${m.visibility === 'internal' ? 'Team note, never shown to the customer. ' : ''}${esc(m.author_label)} - ${fmt(m.created_at)}</div>
        <p>${esc(m.body)}</p></div>`).join('')}</div>
    ${done ? '' : `<div class="composer ${state.mode === 'internal' ? 'note' : ''}">
      <div class="seg">
        <button type="button" data-mode="public" aria-pressed="${state.mode === 'public'}" ${canReply ? '' : 'disabled'}>Reply to customer</button>
        <button type="button" data-mode="internal" aria-pressed="${state.mode === 'internal'}">Note for team only</button>
      </div>
      <textarea id="body" aria-label="Message" placeholder="${state.mode === 'internal' ? 'Only your team will see this' : 'The customer will see this'}">${esc(state.draft)}</textarea>
      <div class="foot">
        ${state.mode === 'public' ? '<label><input type="checkbox" id="setWait"> Pause the clock until the customer answers</label>' : '<span></span>'}
        <button class="btn primary" id="send">${state.mode === 'internal' ? 'Save team note' : 'Send reply'}</button>
      </div>
      ${composerHint ? `<div style="color:var(--muted);font-size:13px;margin-top:6px">${composerHint}</div>` : ''}
    </div>`}
    <details><summary>History (${d.events.length} events, cannot be edited)</summary>
      <ul class="ev">${d.events.map((e) => `<li style="display:contents"><span>${fmt(e.created_at)}</span><span>${esc(e.type.replace(/_/g, ' '))} by ${esc(e.actor)}</span></li>`).join('')}</ul>
    </details>
    <div class="demo">Demo tool: write as the customer. This stands in for email intake.
      <textarea id="custBody" aria-label="Customer message" placeholder="Customer reply"></textarea>
      <button class="btn" id="custSend">Send as customer</button></div>
  </div>`;
  wireDetail(t);
  loadList();
}

function wireDetail(t) {
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  const run = (fn) => async () => { try { await fn(); } catch (e) { toast(e.message); openTicket(t.id, true); } };
  on('#take', run(async () => { await api('POST', `/tickets/${t.id}/take`); await openTicket(t.id); }));
  on('#wait', run(async () => { await api('POST', `/tickets/${t.id}/status`, { status: 'waiting_customer' }); await openTicket(t.id); }));
  on('#resolve', run(async () => { await api('POST', `/tickets/${t.id}/status`, { status: 'resolved' }); await openTicket(t.id); }));
  const prio = $('#prio');
  if (prio) prio.onchange = run(async () => { await api('POST', `/tickets/${t.id}/priority`, { priority: prio.value }); await openTicket(t.id); });
  document.querySelectorAll('.seg button').forEach((b) => b.onclick = () => { state.draft = $('#body').value; state.mode = b.dataset.mode; openTicket(t.id, true); });
  on('#send', run(async () => {
    const body = $('#body').value.trim(); if (!body) { toast('Write a message first'); return; }
    await api('POST', `/tickets/${t.id}/messages`, { body, visibility: state.mode, setWaiting: state.mode === 'public' && $('#setWait').checked });
    state.draft = ''; await openTicket(t.id);
  }));
  on('#custSend', run(async () => {
    const body = $('#custBody').value.trim(); if (!body) { toast('Write the customer message first'); return; }
    const r = await call('/api/customer', 'POST', `/tickets/${t.id}/reply`, { email: t.customer_email, body });
    if (r.newTicket) { toast(`Old ticket could not be reopened. New ticket #${r.ticket.id} created.`); await loadList(); await openTicket(r.ticket.id); }
    else await openTicket(t.id);
  }));
}

$('#list').addEventListener('click', (e) => { const r = e.target.closest('.row'); if (r) { state.mode = 'public'; openTicket(Number(r.dataset.id)); } });
$('#tabs').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { state.scope = b.dataset.scope; loadList(); } });
$('#agent').onchange = (e) => { state.agent = e.target.value; localStorage.setItem('agent', state.agent); state.selected = null; $('#detail').innerHTML = '<div class="empty">Choose a ticket to read the thread and reply.</div>'; loadList(); };
$('#newBtn').onclick = () => $('#newDlg').showModal();
$('#newForm').addEventListener('submit', async (e) => {
  if (e.submitter?.value !== 'ok') return;
  try {
    const r = await call('/api/customer', 'POST', '/tickets', { name: $('#nName').value, email: $('#nEmail').value, subject: $('#nSubject').value, body: $('#nBody').value, priority: $('#nSev').value });
    $('#nSubject').value = ''; $('#nBody').value = '';
    state.scope = 'unassigned'; await loadList(); openTicket(r.ticket.id);
  } catch (err) { toast(err.message); }
});

(async () => { await loadAgents(); await loadList(); setInterval(() => { if (!document.hidden) loadList(); }, 30000); })();
</script>
</body>
</html>
