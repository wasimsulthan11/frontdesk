# Render Blueprint: New > Blueprint > pick this repo
databases:
  - name: frontdesk-db
    plan: free
services:
  - type: web
    name: frontdesk
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: frontdesk-db
          property: connectionString
